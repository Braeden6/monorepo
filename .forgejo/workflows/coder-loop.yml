name: coder-loop

# Delivery loop for ONE Forgejo issue labelled `coder`, in whichever repo this file is installed:
#
#   claim (b6 409) -> b6 code job -> PR -> CI (<=2 fix rounds, `continue` on the same branch/PR)
#     -> "Coder evidence" comment -> b6 review (<=1 `continue` round on `concerns`) -> human gate
#
# A job that ends `pr_open` with wip_reason=max_turns (it ran out of turns; a WIP PR exists) is not
# a failure yet: step 3 waits for CI on that PR and spends one fix round on "finish the remaining
# work" (the CI result in the task) before anything goes to coder:needs-human.
#
# It is orchestration only: every step is curl + jq against the Forgejo API and the b6 dev API
# (POST /api/code-jobs, GET /api/code-jobs/{id}, .../continue, .../retry, POST /api/reviews/pr).
# No repo code is built or run on the runner, and nothing here merges or touches develop/main:
# the last step is a label + comment. Branch protection and a human do the merging.
#
# Repos: everything repo-specific comes from the run's own repository -- REPO (owner/name) and
# REPO_ID (the name, which code_repos.yaml requires to equal the b6 repo_id) -- so the SAME file
# runs in any repo listed in api/config/code_repos.yaml. homelab-meta's copy is canonical; to
# enable another repo, commit an identical copy at .forgejo/workflows/coder-loop.yml there (the
# `coder-loop` runner is registered for the whole braeden6 account; no secrets live in Forgejo).
# A copy, not a reusable-workflow call: Forgejo only lets another repo call a workflow in a PUBLIC
# repo, and homelab-meta is private (tested on Forgejo 15.0.2: "failed to access repo
# homelab-meta: repo does not exist"). So every run compares its own file's blob sha with
# homelab-meta develop's and warns on the issue when they differ.
#
# Model: an issue label `model:<id>` (e.g. `model:gpt-6.1-sol`) asks b6 for that model; b6 checks
# it against the repo's allowed_models (code_repos.yaml) and refuses the job otherwise. No label =
# the repo's default_model. Continue/retry rounds keep the job's model. Create model labels by hand.
#
# CI: one rule for every repo. The verdict is the Forgejo commit status CI_CONTEXT
# (`CI / fast (pull_request)`, the aggregating job each repo's .forgejo/workflows/ci.yml defines
# and its develop branch protection requires) on the PR head. CD stays per repo and is never the
# loop's business. Preview (optional, never the verdict): when GH_MIRROR is set (the repo is
# push-mirrored to that GitHub repo, today only braeden6/monorepo) and GitHub has a successful
# deployment for the head sha (Vercel), its URL is posted on the PR once per sha.
#
# The PR can be merged or closed while the loop is still waiting. The CI wait notices: merged
# closes the issue (if Forgejo did not) and drops coder:working; closed hands it to a human.
#
# Labels (create once; the init step creates any that are missing):
#   coder              the trigger. Add it to an issue (or run workflow_dispatch with the number).
#   coder:working      the loop owns the issue.
#   coder:ready        PR is green and reviewed; waiting for a human to merge.
#   coder:needs-human  the loop stopped (CI red after 2 fix rounds, budget/429, job failed, review
#                      failed, the task needs a change to a protected path -- result.blocked --
#                      ...); the issue comment says why. Remove the label and re-trigger
#                      to run it again. A protected-path stop also prints the one command
#                      (deploy/coder/takeover.py) that moves the PR to a human/ branch.
#
# Intake lock: the b6 job claim. A second job for the same repo+issue while one is open/merged
# gets HTTP 409 "issue already claimed" and this run comments and exits; failed_attempt and
# cancelled release the claim. No comment-locks, no `claimed` label. Each run adds its run number
# to the task text, so b6's idempotent "same request -> same job" shortcut cannot hand a second
# run the first run's job: the claim decides.
#
# Waiting: the workflow POLLS GET /api/code-jobs/{id} and the Forgejo commit status, with an
# exponential backoff (15 s growing to 60 s). b6 can push job state to a `callback_url`
# (app/core/code_jobs/callback_dispatch.py), but the receiver must be an HTTP endpoint that is
# up for the whole run and reachable from meta-api (http only to 10.0.1.1/127.0.0.1); a step
# that listens is dead between steps and on runner restarts, so v1 polls instead. A poll costs
# one tiny GET per <=60 s, against jobs that run for minutes.
#
# Runner: `coder-loop` (server5, host executor, capacity 3, 3h job timeout; registered for the whole
# braeden6 account, so it serves every repo this file is copied into). Its own runner, so up to 3
# loops run in parallel and a loop (~10-40 min, up to 75 min of polling) no longer holds the `host`
# runner that develop/main CD needs. Install/rebuild: deploy/install-coder-loop-runner.sh (unit
# forgejo-runner-coder-loop.service, dir /srv/app-data/forgejo-runner-coder-loop). If that runner is
# down the run just sits queued: check `systemctl --user status forgejo-runner-coder-loop`. The
# loop is curl/jq only and keeps its state in its own mktemp dir, so concurrent runs do not share
# anything but the b6 claim. Trust: `issues: labeled` and `workflow_dispatch` need repo write
# access, and issue text is only ever passed to b6 as data (never expanded into a shell command).
#
# Secrets are NOT in this repo or in Forgejo: the init step reads the b6 engine auth from
# /srv/app-data/homelab-meta-dev/b6-internal.env and the Forgejo token from
# /srv/app-data/homelab-meta/forgejo-issue.git-credentials (host files, braeden-only) into 0600
# curl header files that are deleted at the end. This only works because the runner is the host.
# Never `set -x` here.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Forgejo issue number to run the coder loop on'
        required: true

# One loop per issue. Not cancelled: a second trigger for the same issue waits, then hits the
# b6 claim (409) and exits.
concurrency:
  group: coder-loop-${{ github.repository }}-issue-${{ github.event.inputs.issue || github.event.issue.number }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  loop:
    # Labelling the issue with anything but `coder` (the loop itself adds coder:working etc.)
    # starts a run whose only job is skipped here.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'coder' }}
    runs-on: coder-loop
    timeout-minutes: 170
    env:
      REPO: ${{ github.repository }}
      GH_MIRROR: ${{ github.repository == 'braeden6/monorepo' && 'Braeden6/monorepo' || '' }}
      CI_CONTEXT: 'CI / fast (pull_request)'
      FORGEJO: https://git.home.braeden6.com
      B6: http://10.0.1.1:8097
      RUN_ID: ${{ github.run_number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
      ISSUE_IN: ${{ github.event.inputs.issue || github.event.issue.number }}
      MAX_CI_FIX_ROUNDS: '2'
    steps:
      - name: init (auth header files, helpers, labels)
        run: |
          set -euo pipefail
          umask 077
          STATE=$(mktemp -d /tmp/coder-loop.XXXXXX)
          echo "STATE=$STATE" >> "$GITHUB_ENV"
          echo "REPO_ID=${REPO#*/}" >> "$GITHUB_ENV"   # b6 repo_id == Forgejo repo name
          (
            set +x; . /srv/app-data/homelab-meta-dev/b6-internal.env
            printf 'X-B6-Internal-Secret: %s\nTailscale-User-Login: %s\n' "$META_INTERNAL_SECRET" "$META_DEPLOY_DRAIN_LOGIN" > "$STATE/b6.hdr"
            tok=$(sed -E 's#.*oauth2:([^@]*)@.*#\1#' /srv/app-data/homelab-meta/forgejo-issue.git-credentials)
            printf 'Authorization: token %s\n' "$tok" > "$STATE/fj.hdr"
          )
          : > "$STATE/vars"; : > "$STATE/timeline"; : > "$STATE/jobs.tsv"
          cat > "$STATE/lib.sh" <<'LIB'
          set +x
          log(){ echo "[$(date -u +%H:%M:%S)] $*"; }
          mark(){ log "$*"; echo "$(date -u +%H:%M:%S) $*" >> "$STATE/timeline"; }
          setv(){ printf '%s=%q\n' "$1" "$2" >> "$STATE/vars"; }   # step-to-step state (last write wins)
          gh_env(){ echo "$1=$2" >> "$GITHUB_ENV"; }                 # only what a later `if:` reads
          backoff(){ sleep "$1"; DELAY=$(( $1 * 3 / 2 )); [ "$DELAY" -le 60 ] || DELAY=60; }   # 15 -> 22 -> 33 -> 49 -> 60 ...

          # Forgejo: METHOD PATH [-]  ("-" = JSON body on stdin). Secrets come from the header file only.
          fj(){ local d=(); [ "${3:-}" = "-" ] && d=(-H 'Content-Type: application/json' --data-binary @-)
                curl -sS -m 60 -X "$1" -H @"$STATE/fj.hdr" "${d[@]}" "$FORGEJO/api/v1$2"; }
          # b6: METHOD PATH [json]  -> B6_CODE (000 = unreachable) and B6_BODY. Never fails the shell.
          b6call(){ local d=(); [ -n "${3:-}" ] && d=(-H 'Content-Type: application/json' --data-binary "$3")
                B6_CODE=$(curl -sS -m "${B6_TIMEOUT:-60}" -o "$STATE/b6.out" -w '%{http_code}' -X "$1" -H @"$STATE/b6.hdr" "${d[@]}" "$B6$2" 2>/dev/null) || B6_CODE=000
                B6_BODY=$(cat "$STATE/b6.out" 2>/dev/null || true); rm -f "$STATE/b6.out"; }
          say(){ jq -n --arg b "$1" '{body:$b}' | fj POST "/repos/$REPO/issues/${2:-$ISSUE}/comments" - >/dev/null; }

          label_id(){ fj GET "/repos/$REPO/labels?limit=100" | jq -r --arg n "$1" '[.[]|select(.name==$n)|.id]|first // empty'; }
          ensure_label(){ [ -n "$(label_id "$1")" ] || jq -n --arg n "$1" --arg c "$2" '{name:$n,color:$c}' | fj POST "/repos/$REPO/labels" - >/dev/null; }
          label_add(){ local id; id=$(label_id "$1"); [ -z "$id" ] || jq -n --argjson l "$id" '{labels:[$l]}' | fj POST "/repos/$REPO/issues/$ISSUE/labels" - >/dev/null || true; }
          label_rm(){ local id; id=$(label_id "$1"); [ -z "$id" ] || fj DELETE "/repos/$REPO/issues/$ISSUE/labels/$id" >/dev/null || true; }

          # one line per b6 job for the gate comment: role id state turns cost
          note_job(){ jq -r --arg role "$1" '[$role, .id, .state, (.result.num_turns // "-" | tostring),
                (if .result.cost_usd == null then "-" else (.result.cost_usd * 100 | round / 100 | tostring) end)] | @tsv' <<<"$2" >> "$STATE/jobs.tsv"; }
          jobs_md(){ awk -F'\t' '{printf "- %s: job `%s` (%s), %s turns, USD %s\n", $1, $2, $3, $4, $5}' "$STATE/jobs.tsv"; }

          # Stop the loop and hand the issue to a human. Callers `exit 0` after it.
          needs_human(){
            local prl="(none yet)"; [ -z "${PR:-}" ] || prl="$FORGEJO/$REPO/pulls/$PR"
            mark "needs-human: $1"
            label_rm coder:working; label_add coder:needs-human
            say "$(printf '**coder-loop run %s stopped: needs a human.**\n\n%s\n\n- PR: %s\n- run: %s\n\nJobs:\n%s\n\nTimeline (UTC):\n```\n%s\n```' \
              "$RUN_ID" "$1" "$prl" "$RUN_URL" "$(jobs_md)" "$(cat "$STATE/timeline")")"
            gh_env STOP 1; }

          # Wait (bounded, exponential backoff) until the coder has finished: its result is in, or the
          # job is terminal. Sets JV (job json), JOB_STATE (or "timeout"). Tolerates an api restart.
          wait_job(){ local deadline=$((SECONDS + ${JOB_WAIT_S:-4500})) last="" DELAY=15
            while :; do
              b6call GET "/api/code-jobs/$1"
              if [ "$B6_CODE" = 200 ] && jq -e '.job.id' <<<"$B6_BODY" >/dev/null 2>&1; then
                JV=$(jq -c .job <<<"$B6_BODY"); JOB_STATE=$(jq -r .state <<<"$JV")
                [ "$JOB_STATE" = "$last" ] || { log "job $1 state=$JOB_STATE"; last=$JOB_STATE; }
                case "$JOB_STATE" in failed_attempt|cancelled|merged) return 0;; esac
                [ "$(jq -r '.result != null' <<<"$JV")" != true ] || return 0
              else log "GET job $1 -> HTTP $B6_CODE (will retry)"; fi
              [ $SECONDS -lt $deadline ] || { JOB_STATE=timeout; return 0; }
              backoff "$DELAY"
            done; }
          # one-line account of how a job ended, for comments
          job_problem(){ jq -r '"state=\(.state), exit=\(.result.exit // "-"), wip_reason=\(.result.wip_reason // "-"), summary: \((.result.summary // "(no result reported)") | gsub("\\s+"; " ") | .[0:400])"' <<<"$JV"; }
          budget_like(){ jq -e '(.result.summary // "") | test("429|rate.?limit|usage limit|quota|budget|overloaded|credit"; "i")' <<<"$JV" >/dev/null; }
          # b6 refused a push of this job for protected paths (result.blocked, deploy/coder/protected-paths.txt):
          # the task needs a guard change a coder may not make, so a human takes it from here.
          is_blocked(){ jq -e '.result.blocked == "protected_paths"' <<<"$JV" >/dev/null; }
          blocked_note(){ local how="No PR was opened, so there is nothing to take over: make the change by hand."
            [ -z "${PR:-}" ] || how=$(printf 'A coder-* branch can never carry that change. To finish it by hand, move the PR to a human branch (from a homelab-meta checkout):\n\n```\npython3 deploy/coder/takeover.py %s %s\n```\n\nthen make the protected change on the human/ branch it prints, and push.' "$REPO" "$PR")
            printf 'job %s needs a change to protected paths, which a coder may not make (CI/CD, deploy, policy, check tooling; see deploy/coder/protected-paths.txt and protected-paths.d/%s.txt):\n%s\n\nThe coder was told to finish everything else and describe the needed change in the PR body. %s' \
              "$1" "$REPO_ID" "$(jq -r '.result.blocked_paths // [] | map("- `" + . + "`") | join("\n")' <<<"$JV")" "$how"; }
          # the coder ran out of turns but left a PR (WIP commit): worth one continue round, not a stop
          out_of_turns(){ jq -e '.state == "pr_open" and .pr_url != null and .result.wip_reason == "max_turns"' <<<"$JV" >/dev/null; }
          # the job reached a usable PR: open/merged, a PR url, and no unfinished WIP
          job_ok(){ jq -e '(.state == "pr_open" or .state == "merged") and (.pr_url != null) and (.result.wip_reason == null)' <<<"$JV" >/dev/null; }

          # Optional preview link, never the CI verdict: the newest GitHub deployment of the sha on the
          # mirror (Vercel) and its newest status. One look, no waiting, no token; any miss posts
          # nothing. Sets PREVIEW_URL; posts it on the PR at most once per sha (a marker in the
          # comment, so a rerun does not post it again). sha PR
          preview_comment(){ local tag="<!-- coder-loop vercel-preview $1 -->" gh="https://api.github.com/repos/${GH_MIRROR:-}" dep
            [ -n "${GH_MIRROR:-}" ] || return 0
            dep=$(curl -sS -m 20 "$gh/deployments?sha=$1&per_page=5" 2>/dev/null | jq -r 'sort_by(.created_at) | last | .id // empty' 2>/dev/null) || dep=""
            [ -n "$dep" ] || return 0
            PREVIEW_URL=$(curl -sS -m 20 "$gh/deployments/$dep/statuses?per_page=1" 2>/dev/null \
              | jq -r 'first | select(.state == "success") | .environment_url // .target_url // empty' 2>/dev/null) || PREVIEW_URL=""
            [ -n "$PREVIEW_URL" ] || return 0
            if fj GET "/repos/$REPO/issues/$2/comments" | jq -e --arg m "$tag" 'any(.[]?; (.body // "") | contains($m))' >/dev/null 2>&1; then return 0; fi
            say "$(printf 'Preview of `%s`: %s\n\n%s' "${1:0:8}" "$PREVIEW_URL" "$tag")" "$2"; mark "PR #$2: posted preview for ${1:0:8}"; }

          # PR json on stdin -> merged | closed | nothing (open)
          pr_end(){ jq -r 'if .merged == true then "merged" elif .state == "closed" then "closed" else empty end' 2>/dev/null || true; }
          # The PR was merged or closed under the loop (a human acted first): finish cleanly. merged ->
          # close the issue if Forgejo did not, drop coder:working; closed -> needs-human. Callers `exit 0` after it.
          pr_ended(){
            if [ "$1" != merged ]; then needs_human "PR #$PR was closed without merging while the loop was running"; return 0; fi
            mark "PR #$PR was merged before the loop finished"
            [ "$(fj GET "/repos/$REPO/issues/$ISSUE" | jq -r '.state? // ""')" = closed ] \
              || jq -n '{state:"closed"}' | fj PATCH "/repos/$REPO/issues/$ISSUE" - >/dev/null || true
            label_rm coder:working
            say "$(printf 'coder-loop run %s: PR #%s was merged before the loop finished, so it stopped there. Issue closed.\n\n- run: %s\n\nTimeline (UTC):\n```\n%s\n```' \
              "$RUN_ID" "$PR" "$RUN_URL" "$(cat "$STATE/timeline")")"
            gh_env STOP 1; }
          # `Closes #ISSUE` in the PR body, so a merge at any point (even mid-loop) closes the issue:
          # Forgejo closes on a closing keyword when the PR lands on the default branch (develop).
          # Idempotent: once when the PR is first seen, again at the gate (a round may rewrite the body).
          ensure_closes(){ local body; body=$(fj GET "/repos/$REPO/pulls/$PR" | jq -r '.body? // ""')
            grep -qiE "(close[sd]?|fix(e[sd])?|resolve[sd]?) #$ISSUE\b" <<<"$body" && return 0
            jq -n --arg b "$(printf '%s\n\nCloses #%s' "$body" "$ISSUE")" '{body:$b}' \
              | fj PATCH "/repos/$REPO/pulls/$PR" - >/dev/null && mark "PR #$PR: added Closes #$ISSUE" || true; }

          # Wait (bounded) for CI on the PR head: its CI_CONTEXT commit status, the one check branch
          # protection requires. Sets HEAD and CI_STATE: success|failure|error|timeout, or
          # merged|closed when the PR was merged or closed under the loop.
          ci_wait(){ local deadline=$((SECONDS + ${CI_WAIT_S:-2700})) pr end last="" DELAY=20
            while :; do
              pr=$(fj GET "/repos/$REPO/pulls/$1" 2>/dev/null || true)
              HEAD=$(jq -r '.head.sha // empty' <<<"$pr" 2>/dev/null || true)
              end=$(pr_end <<<"$pr"); [ -z "$end" ] || { CI_STATE=$end; return 0; }
              if [ -n "$HEAD" ]; then
                CI_STATE=$(fj GET "/repos/$REPO/commits/$HEAD/status" 2>/dev/null | jq -r --arg c "$CI_CONTEXT" \
                  '[.statuses[]? | select(.context == $c) | .status] | first // "pending"' 2>/dev/null) || CI_STATE=pending
                [ -n "$CI_STATE" ] || CI_STATE=pending
                [ "$CI_STATE" = "$last" ] || { log "PR #$1 head ${HEAD:0:8} $CI_CONTEXT=$CI_STATE"; last=$CI_STATE; }
                case "$CI_STATE" in success|failure|error) return 0;; esac
              fi
              [ $SECONDS -lt $deadline ] || { CI_STATE=timeout; return 0; }
              backoff "$DELAY"
            done; }
          # The failing CI job's log is not in the Forgejo API: find it in the forgejo container, copy it
          # out and read it (same route as api/app/core/chat/ci_output.py). Sets FAIL_JOB, EXCERPT (<=2500 chars).
          ci_excerpt(){ local ctx c j id="" path
            ctx=$(fj GET "/repos/$REPO/commits/$HEAD/status" | jq -r '.statuses[] | select(.status == "failure" or .status == "error") | .context')
            FAIL_JOB=""
            while IFS= read -r c; do
              j=$(sed -nE 's#^CI / ([A-Za-z0-9_-]+).*#\1#p' <<<"$c"); [ -n "$j" ] && [ "$j" != fast ] || continue
              FAIL_JOB=$j
              id=$(fj GET "/repos/$REPO/actions/tasks?limit=100" | jq -r --arg h "$HEAD" --arg j "$j" \
                    '[.workflow_runs[] | select(.head_sha == $h and .name == $j)] | sort_by(.id) | last | .id // empty')
              [ -z "$id" ] || break
            done <<<"$ctx"
            [ -n "$FAIL_JOB" ] || FAIL_JOB=$(head -1 <<<"$ctx")
            EXCERPT="(no CI log found for ${HEAD:0:8})"; [ -n "$id" ] || return 0
            path=$(docker exec forgejo sh -c "find /data/gitea/actions_log/$REPO -name '$id.log.zst' 2>/dev/null | head -1") || path=""
            [ -n "$path" ] && docker cp "forgejo:$path" "$STATE/ci.log.zst" >/dev/null 2>&1 || return 0
            local txt; txt=$(zstd -dcq "$STATE/ci.log.zst" | sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g; s/^[0-9T:.-]+Z //')
            EXCERPT=$(grep -E 'FAILED|FAIL |ERROR|error:|Error:|AssertionError|Traceback|^E  |✘|✖|FAIL:|::error' <<<"$txt" | tail -40 | cut -c1-240 | tail -c 2500 || true)
            [ -n "$EXCERPT" ] || EXCERPT=$(tail -25 <<<"$txt" | cut -c1-240 | tail -c 2500); }

          # One follow-up round on the SAME branch/PR: POST .../continue, wait for the coder, and require a
          # new, finished (non-WIP) commit on the PR. role = fix | review. Uses/sets JOB, HEAD. return 1 = stopped.
          run_round(){ local role=$1 task=$2 before=$HEAD new
            b6call POST "/api/code-jobs/$JOB/continue" "$(jq -nc --arg t "$task" '{task:$t}')"
            case "$B6_CODE" in
              200) ;;
              409) needs_human "$role round: b6 refused the continue (issue claimed): $(printf %.200s "$B6_BODY")"; return 1;;
              *)   needs_human "$role round: continue failed, HTTP $B6_CODE $(printf %.200s "$B6_BODY")"; return 1;;
            esac
            JOB=$(jq -er '.job.id' <<<"$B6_BODY"); setv JOB "$JOB"; mark "$role round: continue job $JOB"
            wait_job "$JOB"; [ "$JOB_STATE" = timeout ] || note_job "$role" "$JV"
            if [ "$JOB_STATE" = timeout ]; then needs_human "$role round: job $JOB did not finish in time"; return 1; fi
            if [ "$JOB_STATE" = cancelled ]; then needs_human "$role round: job $JOB was cancelled"; return 1; fi
            if is_blocked; then needs_human "$role round: $(blocked_note "$JOB")"; return 1; fi
            if budget_like && [ "$(jq -r '.result.is_error' <<<"$JV")" = true ]; then
              needs_human "$role round: job $JOB hit a budget/rate limit: $(job_problem)"; return 1; fi
            if [ "$(jq -r '.result.wip_reason' <<<"$JV")" != null ]; then needs_human "$role round: job $JOB ended unfinished: $(job_problem)"; return 1; fi
            new=$(fj GET "/repos/$REPO/pulls/$PR" | jq -r '.head.sha')
            if [ "$new" = "$before" ]; then needs_human "$role round: job $JOB pushed no new commit ($(job_problem))"; return 1; fi
            HEAD=$new; mark "$role round: PR #$PR head ${HEAD:0:8}"; }
          LIB
          bash -n "$STATE/lib.sh"
          . "$STATE/lib.sh"
          # repo precondition, created here only if missing (a race between two first-ever runs could
          # create a duplicate; create the labels by hand once if that matters)
          ensure_label coder:working fbca04; ensure_label coder:ready 0e8a16; ensure_label coder:needs-human d73a4a

      - name: 1. intake (claim = b6 job create)
        run: |
          set -euo pipefail; . "$STATE/lib.sh"
          [[ "$ISSUE_IN" =~ ^[0-9]+$ ]] || { log "bad issue number"; exit 1; }
          ISSUE=$ISSUE_IN; export ISSUE
          iss=$(fj GET "/repos/$REPO/issues/$ISSUE")
          [ "$(jq -r .state <<<"$iss")" = open ] || { log "issue #$ISSUE is not open"; exit 1; }
          jq -e '[.labels[].name] | index("coder")' <<<"$iss" >/dev/null || { log "issue #$ISSUE has no coder label"; exit 1; }
          # Drift check (this file is copied verbatim into other repos; see the header). Warns, never stops.
          f=.forgejo/workflows/coder-loop.yml
          mine=$(fj GET "/repos/$REPO/contents/$f?ref=${GITHUB_SHA:-}" | jq -r '.sha? // empty' 2>/dev/null) || mine=""
          canon=$(fj GET "/repos/braeden6/homelab-meta/contents/$f?ref=develop" | jq -r '.sha? // empty' 2>/dev/null) || canon=""
          if [ -n "$mine" ] && [ -n "$canon" ] && [ "$mine" != "$canon" ]; then
            mark "coder-loop.yml drift: ${mine:0:8} here, ${canon:0:8} on homelab-meta develop"
            say "$(printf '**coder-loop drift:** `%s` here (blob `%s`) differs from braeden6/homelab-meta develop (blob `%s`). This run uses the copy here; copy the canonical file over in a human/ PR (`.forgejo/` is protected from coders).' "$f" "${mine:0:8}" "${canon:0:8}")"
          fi
          PREFIX='Scenario first: write Given/When/Then before reading the implementation; cite exact test assertions; smallest change; run the pre-push gates your instructions name, in the foreground, before pushing; never use background tasks'
          # b6 caps a task at 4000 chars (and `continue` appends ~350): clip the issue text, then add the run tag
          task=$(jq -rn --arg p "$PREFIX" --arg t "$(jq -r .title <<<"$iss")" --arg b "$(jq -r '.body // ""' <<<"$iss")" --arg r "$RUN_ID" '
                 ($p + "\n\n" + $t + (if $b != "" then "\n\n" + $b else "" end)) as $x
                 | (if ($x | length) > 3300 then $x[0:3300] + "\n[issue text truncated]" else $x end) + "\n\n(coder-loop run " + $r + ")"')
          # model:<id> label -> requested model; b6 validates it against the repo's allowed_models
          model=$(jq -r '[.labels[].name | select(startswith("model:")) | ltrimstr("model:")] | join(" ")' <<<"$iss")
          if [[ "$model" == *" "* ]]; then
            say "$(printf 'coder-loop run %s: not started. The issue has more than one model: label (%s); keep one.\n\n%s' "$RUN_ID" "$model" "$RUN_URL")"
            exit 1
          fi
          b6call POST /api/code-jobs "$(jq -nc --arg t "$task" --argjson i "$ISSUE" --arg r "$REPO_ID" --arg m "$model" \
                '{repo_id:$r,task:$t,issue:$i} + (if $m == "" then {} else {model:$m} end)')"
          case "$B6_CODE" in
            200) ;;
            409) other=$(jq -r '.job_id // "?"' <<<"$B6_BODY")
                 mark "issue #$ISSUE already claimed by job $other"
                 say "$(printf 'coder-loop run %s: not started. This issue is already claimed by b6 job `%s` (open or merged PR). A failed or cancelled job releases the claim.\n\n%s' "$RUN_ID" "$other" "$RUN_URL")"
                 exit 0;;
            *)   say "$(printf 'coder-loop run %s could not start a job: HTTP %s %.200s\n\n%s' "$RUN_ID" "$B6_CODE" "$B6_BODY" "$RUN_URL")" || true
                 log "job create failed: HTTP $B6_CODE"; exit 1;;
          esac
          JV=$(jq -c .job <<<"$B6_BODY"); JOB=$(jq -r .id <<<"$JV")
          mark "claimed issue #$ISSUE: job $JOB started"
          setv ISSUE "$ISSUE"; setv JOB "$JOB"; setv RETRIED 0; gh_env ISSUE "$ISSUE"
          label_add coder:working
          say "$(printf 'coder-loop run %s: started b6 code job `%s` (model %s, %s). Labelled `coder:working`.' "$RUN_ID" "$JOB" "$(jq -r '.model // "?"' <<<"$JV")" "$RUN_URL")"

      - name: 2. wait for the coder -> PR (one retry from WIP)
        if: env.ISSUE != '' && env.STOP != '1'
        run: |
          set -euo pipefail; . "$STATE/lib.sh"; . "$STATE/vars"; PR=""
          while :; do
            wait_job "$JOB"
            [ "$JOB_STATE" != timeout ] || { needs_human "job $JOB did not finish within the wait limit"; exit 0; }
            note_job "coder" "$JV"
            url=$(jq -r '.pr_url // empty' <<<"$JV"); [ -z "$url" ] || PR=${url##*/}   # link a partial PR in the hand-off comment
            if is_blocked; then needs_human "$(blocked_note "$JOB")"; exit 0; fi   # even with a PR: the guard change is still owed
            if job_ok; then break; fi
            problem=$(job_problem); mark "job $JOB not ok: $problem"
            if budget_like; then needs_human "job $JOB stopped on a budget/rate limit (not retried): $problem"; exit 0; fi
            if out_of_turns; then mark "job $JOB ran out of turns with a WIP PR: step 3 finishes it in a continue round"; break; fi
            pushed=$(jq -r '.current_sha != null' <<<"$JV"); eligible=$(jq -r .retry_eligible <<<"$JV")
            if [ "$JOB_STATE" = failed_attempt ] && [ "$pushed" = true ] && [ "$eligible" = true ] && [ "$RETRIED" = 0 ]; then
              RETRIED=1; setv RETRIED 1
              b6call POST "/api/code-jobs/$JOB/retry"
              [ "$B6_CODE" = 200 ] || { needs_human "retry of job $JOB failed: HTTP $B6_CODE $(printf %.200s "$B6_BODY")"; exit 0; }
              JOB=$(jq -er .job.id <<<"$B6_BODY"); setv JOB "$JOB"; mark "retry from the pushed branch: job $JOB"; continue
            fi
            needs_human "job $JOB did not produce a finished PR ($problem)"; exit 0
          done
          setv PR "$PR"; mark "job $JOB -> PR #$PR"
          ensure_closes

      - name: 3. CI, evidence, review (fix and review rounds on the same PR)
        if: env.ISSUE != '' && env.STOP != '1'
        run: |
          set -euo pipefail; . "$STATE/lib.sh"; . "$STATE/vars"
          fixes=0; reviews=0; VERDICT=""
          b6call GET "/api/code-jobs/$JOB"; JV=$(jq -c .job <<<"$B6_BODY")   # the PR's current job (step 2 ended on it)
          while :; do
            ci_wait "$PR"; mark "PR #$PR head ${HEAD:0:8} CI=$CI_STATE"
            case "$CI_STATE" in merged|closed) pr_ended "$CI_STATE"; exit 0;; esac
            # A WIP PR (step 2 let an out-of-turns job through): whatever CI says, the work is
            # unfinished. Only that first job can be WIP here; run_round refuses a WIP result.
            wip=""; if out_of_turns; then wip=1; fi
            if [ "$CI_STATE" != success ] || [ -n "$wip" ]; then
              [ "$CI_STATE" != timeout ] || [ -n "$wip" ] || { needs_human "CI on ${HEAD:0:8} did not finish within the wait limit"; exit 0; }
              [ "$fixes" -lt "$MAX_CI_FIX_ROUNDS" ] || { needs_human "${wip:+the coder ran out of turns and }CI is $CI_STATE on ${HEAD:0:8} after $fixes fix rounds"; exit 0; }
              fixes=$((fixes + 1))
              if [ "$CI_STATE" = failure ] || [ "$CI_STATE" = error ]; then
                ci_excerpt; mark "CI job '$FAIL_JOB' failed; excerpt ${#EXCERPT} chars"
                ci_note="CI $FAIL_JOB failed on ${HEAD:0:8}: $EXCERPT."
              else ci_note="CI on ${HEAD:0:8} is ${CI_STATE/timeout/still pending}."; fi
              if [ -n "$wip" ]; then
                mark "WIP PR (max_turns): continue round to finish the remaining work"
                run_round fix "The previous job ran out of turns (max_turns) and left this PR unfinished (a wip commit). $ci_note Finish the remaining work on this branch: read the wip commit and the PR, complete what is left, run the pre-push gates, and push." || exit 0
              else
                run_round fix "$ci_note Fix it on this branch." || exit 0
              fi
              continue
            fi
            # --- evidence (from the b6 job result, not scraped from the PR body)
            files=$(fj GET "/repos/$REPO/pulls/$PR/files?limit=50" | jq -r '.[] | "- `\(.filename)` (+\(.additions)/-\(.deletions))"')
            # screenshots: the host (vmctl collect_evidence) attached them to the PR, named <job8>-<file>, before the job ended
            shots=$(fj GET "/repos/$REPO/issues/$PR/assets" | jq -r --arg p "$(jq -r '.id[:8]' <<<"$JV")-" \
                '[.[]? | select(.name | startswith($p)) | "![\(.name)](\(.browser_download_url))"] | join("\n\n")' 2>/dev/null) || shots=""
            ev=$(jq -r --arg head "${HEAD:0:8}" --arg ci "$CI_STATE" --arg pr "$PR" --arg run "$RUN_URL" --arg files "$files" --arg shots "$shots" '
                "## Coder evidence\n\nb6 job `\(.id)` · PR #\($pr) · head `\($head)` · CI **\($ci)** · [engine run](\($run))\n\n"
                + "Turns: \(.result.num_turns // "n/a") · cost: USD \(if .result.cost_usd == null then "n/a" else (.result.cost_usd * 100 | round / 100) end) · wip_reason: \(.result.wip_reason // "none")\n\n"
                + "### Summary\n\(.result.summary // "(no summary reported)")\n\n"
                + "### Checks the coder ran\n"
                + ((.result.checks // []) | if length == 0 then "- (none recorded)" else map("- \(if .passed then "PASS" else "FAIL" end) `\(.command | gsub("\\s+"; " ") | .[0:140])`") | join("\n") end)
                + "\n_b6 lists every Bash call that mentions `ci-local.sh`; read the command, a PASS only means the call did not error._"
                + "\n\n### Files touched\n\($files)"
                + (if $shots == "" then "" else "\n\n### Screenshots\n\n\($shots)" end)' <<<"$JV")
            say "$ev" "$PR"; mark "posted Coder evidence on PR #$PR"
            preview_comment "$HEAD" "$PR"
            # --- review
            B6_TIMEOUT=900 b6call POST /api/reviews/pr "$(jq -nc --argjson n "$PR" --arg r "$REPO_ID" '{repo_id:$r,pr_number:$n}')"
            [ "$B6_CODE" = 200 ] || { needs_human "review failed: HTTP $B6_CODE $(printf %.200s "$B6_BODY")"; exit 0; }
            VERDICT=$(jq -r '.verdict // "unknown"' <<<"$B6_BODY"); REVIEW_URL=$(jq -r '.url // empty' <<<"$B6_BODY"); cid=$(jq -r '.comment_id // empty' <<<"$B6_BODY")
            mark "review verdict=$VERDICT"
            if [ "$VERDICT" = concerns ] && [ "$reviews" -lt 1 ]; then
              reviews=$((reviews + 1))
              findings=""; [ -z "$cid" ] || findings=$(fj GET "/repos/$REPO/issues/comments/$cid" | jq -r '.body // ""' | head -c 2500)
              run_round review "Reviewer (reviewer/v1) raised concerns on ${HEAD:0:8}: ${findings:-see the review comment on the PR}. Address the valid ones on this branch; if a finding is a false alarm, say why in the commit message." || exit 0
              continue
            fi
            break
          done
          setv FIXES "$fixes"; setv REVIEWS "$reviews"; setv VERDICT "$VERDICT"; setv REVIEW_URL "${REVIEW_URL:-}"; setv HEAD "$HEAD"; setv CI_STATE "$CI_STATE"
          setv PREVIEW_URL "${PREVIEW_URL:-}"

      - name: 4. human gate (label + comment; never merge)
        if: env.ISSUE != '' && env.STOP != '1'
        run: |
          set -euo pipefail; . "$STATE/lib.sh"; . "$STATE/vars"
          end=$(fj GET "/repos/$REPO/pulls/$PR" | pr_end); [ -z "$end" ] || { pr_ended "$end"; exit 0; }   # merged/closed during the review
          label_rm coder:working; label_add coder:ready
          ensure_closes
          warn=""; [ "$VERDICT" != concerns ] || warn=$'\n\n**Reviewer concerns are still open after the review round; read the review before merging.**'
          [ -z "${PREVIEW_URL:-}" ] || warn="$warn"$'\n\n'"Preview: $PREVIEW_URL"
          say "$(printf '**coder-loop run %s: ready for a human.** Nothing is merged; develop/main untouched.\n\n- PR: %s/%s/pulls/%s\n- CI on `%s`: **%s**\n- Review verdict: **%s** (%s)\n- Rounds: CI fix %s of %s, review %s of 1, retries %s of 1%s\n\nJobs:\n%s\n\nTimeline (UTC):\n```\n%s\n```' \
            "$RUN_ID" "$FORGEJO" "$REPO" "$PR" "${HEAD:0:8}" "$CI_STATE" "$VERDICT" "${REVIEW_URL:-no url}" "$FIXES" "$MAX_CI_FIX_ROUNDS" "$REVIEWS" "$RETRIED" "$warn" "$(jobs_md)" "$(cat "$STATE/timeline")")"
          mark "gate: coder:ready on issue #$ISSUE"

      - name: on failure or cancel, hand the issue to a human
        if: (failure() || cancelled()) && env.ISSUE != '' && env.STOP != '1'
        run: |
          . "$STATE/lib.sh" || exit 0
          . "$STATE/vars" || true
          needs_human "the workflow itself failed or was cancelled (see $RUN_URL); b6 job ${JOB:-?} may still be running" || true

      - name: cleanup
        if: always()
        run: 'rm -rf "${STATE:-/nonexistent-never}"'
